[project]
name = "trading-ai"
version = "1.0.0"
description = "This is a project that will look for patterns in specified stocks, and recomend purchasing and/or selling."
readme = "README.md"
authors = [
    { name = "Rick Dennison", email = "rdennison12@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
trading-ai = "trading_ai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
